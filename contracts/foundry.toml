[profile.default]
src = "src"
out = "out"
test = "test"
# src/ has zero external dependencies and compiles standalone.
# forge-std is needed only to run the test suite.
libs = ["lib"]
solc = "0.8.24"
# Deploy.s.sol writes the address book here. Foundry denies filesystem access
# outside the project root unless it is granted explicitly.
fs_permissions = [{ access = "read-write", path = "../deployments" }]
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
monad = "${MONAD_RPC}"

[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api" }
