<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Checkout — Voltmart &amp; Corso</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#121721; --line:#1e2633; --ink:#e8edf5; --dim:#8697ad;
    --ok:#3ddc97; --warn:#ffb454; --bad:#ff5c7a; --accent:#5aa9ff;
    font-family: ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:22px 26px;max-width:1100px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0;letter-spacing:-.4px}
  a{color:var(--accent);text-decoration:none;font-size:13px}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;
       border-bottom:1px solid var(--line);font-size:14px;align-items:center}
  .row:last-child{border-bottom:0}
  .sub{font-size:12px;color:var(--dim)}
  .art{font-size:28px}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .plan{background:#0c1119;border:1.5px solid var(--line);border-radius:12px;padding:14px;
        cursor:pointer;transition:border-color .15s}
  .plan:hover{border-color:#3a4759}
  .plan.sel{border-color:var(--accent);background:#131c2b}
  .plan .per{font-size:21px;font-weight:650;letter-spacing:-.5px}
  .plan .n{font-size:12px;color:var(--dim);margin-bottom:6px}
  .plan .tot{font-size:11.5px;color:var(--dim);margin-top:6px}
  .btn{background:var(--accent);color:#04101f;border:0;border-radius:10px;padding:13px 18px;
       font-size:14px;font-weight:650;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:#1d2635;color:var(--ink);border:1px solid #2b3648}
  .pill{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:650}
  .pill.ok{background:rgba(61,220,151,.14);color:var(--ok)}
  .pill.bad{background:rgba(255,92,122,.14);color:var(--bad)}
  .big{font-size:28px;font-weight:650;letter-spacing:-.8px}
  .num{font-variant-numeric:tabular-nums}
  .decline{background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.3);
           border-radius:10px;padding:14px;font-size:13.5px;color:var(--bad)}
  #result{margin-top:14px;font-size:13.5px;min-height:20px}

  /* Order confirmation */
  #confirm{display:none}
  #confirm.show{display:block;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .tickwrap{display:flex;justify-content:center;margin:8px 0 18px}
  .tick{width:84px;height:84px}
  .tick circle{stroke:var(--ok);stroke-width:3;fill:none;
    stroke-dasharray:210;stroke-dashoffset:210;animation:draw .55s ease-out .05s forwards}
  .tick path{stroke:var(--ok);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:44;stroke-dashoffset:44;animation:draw .35s ease-out .5s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .glow{position:absolute;inset:0;pointer-events:none;border-radius:14px;
    background:radial-gradient(420px 160px at 50% 0%,rgba(61,220,151,.14),transparent 70%);
    opacity:0;animation:fade .8s ease-out .3s forwards}
  @keyframes fade{to{opacity:1}}
  .done-h{text-align:center;font-size:26px;font-weight:650;letter-spacing:-.5px;margin:0}
  .done-s{text-align:center;color:var(--dim);font-size:13.5px;margin:8px 0 20px}
  .stag{opacity:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .stag:nth-child(1){animation-delay:.55s}
  .stag:nth-child(2){animation-delay:.65s}
  .stag:nth-child(3){animation-delay:.75s}
  .stag:nth-child(4){animation-delay:.85s}
  .stag:nth-child(5){animation-delay:.95s}
  .conf{position:fixed;top:-12px;width:8px;height:14px;border-radius:2px;
    pointer-events:none;z-index:50;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}
  @media (prefers-reduced-motion: reduce){
    #confirm.show,.stag{animation:none;opacity:1}
    .tick circle,.tick path{animation:none;stroke-dashoffset:0}
    .conf{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Checkout</h1>
  <span class="tag">installments by Rainfall</span>
  <a href="/shop">← back to shop</a>
  <a href="/">agent portal</a>
</header>

<div class="panel" id="cartPanel">
  <div class="label">Your cart</div>
  <div id="cart"><div class="sub">cart is empty</div></div>
</div>

<div class="panel" id="creditPanel">
  <div class="label">Credit decision — live from Monad</div>
  <div id="credit"><div class="sub">checking…</div></div>
</div>

<div class="panel" id="planPanel">
  <div class="label">Choose your plan</div>
  <div class="plans" id="plans"></div>
  <div class="row" style="margin-top:16px">
    <div>
      <div class="sub">total payable</div>
      <div class="big num" id="total">—</div>
      <div class="sub" id="interest"></div>
    </div>
    <button class="btn" id="pay">Have the agent pay</button>
  </div>
  <div id="result"></div>
</div>

<div class="panel" id="confirm" style="position:relative;overflow:hidden">
  <div class="glow"></div>
  <div class="tickwrap">
    <svg class="tick" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="34" />
      <path d="M25 41 l11 11 l20 -22" />
    </svg>
  </div>
  <h2 class="done-h" id="doneH">Order placed</h2>
  <p class="done-s" id="doneS"></p>
  <div id="doneRows"></div>
  <div class="row stag" style="margin-top:16px;border:0">
    <a class="btn ghost" href="/shop" style="text-decoration:none;text-align:center">Keep shopping</a>
    <a class="btn" href="/" style="text-decoration:none;text-align:center">Track repayment →</a>
  </div>
</div>

<script>
const usd = c => '$' + (Number(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
let data = null, chosen = null;

async function load(){
  if (!cart.length){
    cart_.innerHTML = '<div class="sub">cart is empty — <a href="/shop">go to the shop</a></div>';
    creditPanel.style.display = planPanel.style.display = 'none';
    return;
  }
  // One line item per checkout keeps the credit decision unambiguous.
  const sku = cart[0];
  data = await fetch('/api/plans?sku='+encodeURIComponent(sku)).then(r=>r.json());

  document.getElementById('cart').innerHTML = `
    <div class="row">
      <div style="display:flex;gap:12px;align-items:center">
        <span class="art">${data.item.art}</span>
        <div><div>${data.item.label}</div>
          <div class="sub">${data.item.merchant} · MCC ${data.item.mcc} — ${data.item.mccLabel}</div></div>
      </div>
      <div class="big num">${usd(data.item.cents)}</div>
    </div>`;

  document.getElementById('credit').innerHTML = data.approved
    ? `<div class="row">
         <div><span class="pill ok">APPROVED</span>
           <div class="sub" style="margin-top:6px">credit limit ${usd(data.creditLimitCents)}
             · ${data.requiredCollateralBps/100}% collateral required
             · ${data.aprBps/100}% APR</div></div>
       </div>`
    : `<div class="decline"><b>Declined — ${data.reason}.</b><br>
        <span style="color:var(--dim)">Credit limit is ${usd(data.creditLimitCents)}.
        Choosing a longer plan will not change this: the term is the buyer's choice,
        but whether credit is extended at all is the underwriter's.</span></div>`;

  if (!data.approved){ planPanel.style.display = 'none'; return; }

  chosen = data.plans.find(p=>p.installments===4) ?? data.plans[0];
  renderPlans();
}

function renderPlans(){
  document.getElementById('plans').innerHTML = data.plans.map(p=>`
    <div class="plan ${chosen.installments===p.installments?'sel':''}" onclick="pick(${p.installments})">
      <div class="n">${p.installments} installments</div>
      <div class="per num">${usd(p.perInstallmentCents)}</div>
      <div class="tot">total ${usd(p.totalCents)}</div>
    </div>`).join('');
  document.getElementById('total').textContent = usd(chosen.totalCents);
  document.getElementById('interest').textContent =
    `${usd(chosen.interestCents)} interest at ${data.aprBps/100}% APR · flat, not reducing-balance`;
}

function pick(n){ chosen = data.plans.find(p=>p.installments===n); renderPlans(); }

document.getElementById('pay').onclick = async ()=>{
  const btn = document.getElementById('pay');
  btn.disabled = true; btn.textContent = 'Agent working…';
  // A static line during a 20-40s wait is indistinguishable from a hang, which
  // is exactly how this read. Show the clock and the step.
  const t0 = Date.now();
  const tick = setInterval(function(){
    result.innerHTML = '<span class="sub">underwriting, issuing a scoped card, '
      + 'authorizing on Rain… ' + ((Date.now()-t0)/1000).toFixed(0) + 's</span>';
  }, 250);
  try{
    const goal = `A customer is checking out the ${data.item.label} at ${usd(data.item.cents)} `
      + `on a ${chosen.installments}-installment plan. Check the terms and complete the purchase if acceptable.`;
    const res = await fetch('/api/agent?sku='+encodeURIComponent(data.item.sku)
      + '&installments='+chosen.installments + '&goal='+encodeURIComponent(goal),
      { signal: AbortSignal.timeout(180000) });
    const r = await res.json();
    if (res.status === 409) {
      result.innerHTML = '<span style="color:var(--warn)">Another agent run is in progress.</span>';
      return;
    }
    if (r.error) {
      result.innerHTML = '<span style="color:var(--bad)">'+r.error+'</span>';
    } else {
      sessionStorage.removeItem('cart');
      result.innerHTML = '';
      await showConfirmation(r);
    }
  }catch(e){
    result.innerHTML = '<span style="color:var(--bad)">'
      + (e.name === 'TimeoutError' ? 'Agent run timed out after 3 minutes.' : String(e)) + '</span>';
  } finally {
    clearInterval(tick);
    btn.disabled = false; btn.textContent = 'Have the agent pay';
  }
};

/**
 * Swap the checkout for a confirmation. The obligation id is not in the agent's
 * reply -- it decides what to buy, so the plan is only known after the fact --
 * so read back the agent's newest obligation from chain state.
 */
async function showConfirmation(r){
  let ob = null;
  try {
    const st = await fetch('/api/state').then(x=>x.json());
    ob = (st.agreements || []).slice(-1)[0] || null;
  } catch {}

  document.querySelectorAll('#cartPanel,#creditPanel,#planPanel').forEach(el=>el.style.display='none');

  doneS.innerHTML = (r.scripted ? '<span class="pill warn">SCRIPTED AGENT</span> ' : '')
    + (ob ? `${data.item.label} — obligation #${ob.id} is open on Monad.` : data.item.label);

  const rows = [];
  rows.push([data.item.art + ' ' + data.item.label, usd(data.item.cents), data.item.merchant]);
  if (ob) {
    const per = usd(Number(BigInt(ob.installmentAmount) / 10000n));
    rows.push(['Plan', `${ob.installments} × ${per}`, `${data.aprBps/100}% APR`]);
    rows.push(['Merchant settled', usd(Number(BigInt(ob.principal) / 10000n)), 'paid in full, now']);
    const due = ob.nextDueAt - (Date.now()/1000|0);
    rows.push(['First installment', per, due > 0 ? `due in ${due}s` : 'due now']);
  }
  rows.push(['Agent', (r.toolCalls||[]).join(' → '),
    r.usage ? '$' + r.usage.costUsd.toFixed(4) : '']);

  doneRows.innerHTML = rows.map(([a,b,c]) => `
    <div class="row stag">
      <div>${a}<div class="sub">${c||''}</div></div>
      <div style="text-align:right;font-weight:600">${b}</div>
    </div>`).join('');

  confirm_.classList.add('show');
  confirm_.scrollIntoView({behavior:'smooth', block:'start'});
  celebrate();
}

/** Brief, cheap, and disabled under prefers-reduced-motion. */
function celebrate(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#3ddc97','#5aa9ff','#ffb454','#e8edf5'];
  for (let i=0;i<40;i++){
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    d.style.animationDelay = (Math.random()*0.35) + 's';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3600);
  }
}

const cart_ = document.getElementById('cart');
const confirm_ = document.getElementById('confirm');
load();
</script>
</body>
</html>
